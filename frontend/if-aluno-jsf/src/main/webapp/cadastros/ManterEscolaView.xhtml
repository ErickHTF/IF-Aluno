<ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="corpo">

		<h1>Manter Escola</h1>

		<h:form id="frmPesquisa">
			<p:messages id="messages" showDetail="false" closable="true" globalOnly="true">
				<p:autoUpdate />
			</p:messages>

			<p:panel header="Filtros" toggleable="true" collapsed="false" style="margin-top: 20px">
				<p:panelGrid columns="4" style="width: 100%" columnClasses="rotulo, campo, rotulo, campo">

					<p:outputLabel value="Id" for="filtroId" />
					<p:inputText id="filtroId" value="#{manterEscolaBean.filtroId}"
						styleClass="js-inteiro" placeholder="Ex.: 1" />

					<p:outputLabel value="Nome" for="filtroNome" />
					<p:inputText id="filtroNome" value="#{manterEscolaBean.filtroNome}"
						styleClass="js-nome" placeholder="Ex.: IFSP" />

					<p:outputLabel value="Nível" for="filtroNivel" />
					<p:selectOneMenu id="filtroNivel" value="#{manterEscolaBean.filtroNivel}">
						<f:selectItem itemLabel="Todos" itemValue="#{null}" noSelectionOption="true" />
						<f:selectItems value="#{manterEscolaBean.niveis}" var="niv"
							itemLabel="#{niv}" itemValue="#{niv}" />
					</p:selectOneMenu>

					<p:commandButton icon="pi pi-search" value="Pesquisar"
						action="#{manterEscolaBean.pesquisar}"
						update="escolasTable messages"
						process="filtroId filtroNome filtroNivel" />

					<p:commandButton icon="pi pi-times" value="Limpar"
						action="#{manterEscolaBean.limparFiltros}" immediate="true"
						update="filtroId filtroNome filtroNivel escolasTable messages"
						process="@this" />

				</p:panelGrid>
			</p:panel>

			<p:toolbar style="margin-top: 20px">
				<p:toolbarGroup>
					<p:commandButton icon="pi pi-plus" value="Novo" id="botaoNovo"
						actionListener="#{manterEscolaBean.novo}"
						oncomplete="PF('editarDialogWidgetVar').show()"
						update="editarDialog" process="@this" />
				</p:toolbarGroup>
			</p:toolbar>

			<p:dataTable id="escolasTable" var="escola"
				value="#{manterEscolaBean.escolas}" lazy="false"
				style="margin-top: 20px" emptyMessage="Nenhuma escola encontrada."
				rows="10" paginator="true" paginatorAlwaysVisible="true"
				paginatorPosition="bottom" rowsPerPageTemplate="5,10,15">

				<p:column headerText="Id" style="width: 50px; text-align: center">
					<h:outputText value="#{escola.id}" />
				</p:column>

				<p:column headerText="Nome" style="text-align: left">
					<h:outputText value="#{escola.nome}" />
				</p:column>

				<p:column headerText="Nível" style="width: 150px; text-align: center">
					<h:outputText value="#{escola.nivel}" />
				</p:column>

				<p:column headerText="Operações" style="width: 110px; text-align: center">
					<p:commandButton id="cbEditar" icon="pi pi-pencil" title="Editar"
						actionListener="#{manterEscolaBean.editar(escola)}"
						oncomplete="PF('editarDialogWidgetVar').show()"
						update=":frmPesquisa:editarDialog" process="@this" />

					<p:commandButton icon="pi pi-trash" title="Excluir"
						onclick="PF('confirmacaoExclusao').show();" process="@this">
						<f:setPropertyActionListener target="#{manterEscolaBean.escola}"
							value="#{escola}" />
					</p:commandButton>
				</p:column>

			</p:dataTable>

			<p:dialog id="editarDialog"
				header="#{manterEscolaBean.escola.id == null ? 'Nova Escola' : 'Editar Escola'}"
				widgetVar="editarDialogWidgetVar" modal="true" resizable="true"
				closeOnEscape="true" showEffect="explode" hideEffect="explode"
				width="45%" position="center top" maximizable="true" fitViewport="true"
				responsive="true">

				<p:panelGrid id="editarGrid" columns="2" style="width: 100%"
					columnClasses="rotulo, campo">

					<p:outputLabel value="Nome" for="nome" />
					<h:panelGroup>
						<p:inputText id="nome" maxlength="100" required="true"
							requiredMessage="Informe o nome."
							styleClass="js-nome"
							placeholder="Ex.: IFSP"
							validator="#{validadores.nome}"
							value="#{manterEscolaBean.escola.nome}">
							<p:ajax event="blur" process="@this" update="msgNome" />
						</p:inputText>
						<p:message id="msgNome" for="nome" />
					</h:panelGroup>

					<p:outputLabel value="Nível" for="nivel" />
					<h:panelGroup>
						<p:selectOneMenu id="nivel" required="true"
							requiredMessage="Selecione o nível."
							value="#{manterEscolaBean.escola.nivel}">
							<f:selectItem itemLabel="Selecione..." itemValue="#{null}"
								noSelectionOption="true" />
							<f:selectItems value="#{manterEscolaBean.niveis}" var="niv"
								itemLabel="#{niv}" itemValue="#{niv}" />
							<p:ajax event="change" process="@this" update="msgNivel" />
						</p:selectOneMenu>
						<p:message id="msgNivel" for="nivel" />
					</h:panelGroup>

				</p:panelGrid>

				<f:facet name="footer">
					<p:commandButton icon="pi pi-save" id="salvarButton" value="Salvar"
						title="Grava dados da escola"
						actionListener="#{manterEscolaBean.salvar}"
						update=":frmPesquisa:escolasTable :frmPesquisa:messages :frmPesquisa:editarDialog"
						process="@this editarGrid"
						oncomplete="if (!args.validationFailed &amp;&amp; !args.erroApi) { PF('editarDialogWidgetVar').hide(); }" />

					<p:spacer width="10px" />

					<p:commandButton icon="pi pi-times" value="Cancelar" type="button"
						onclick="PF('editarDialogWidgetVar').hide();" process="@this" />
				</f:facet>

			</p:dialog>

			<p:confirmDialog id="confirmacaoExclusaoDialog"
				widgetVar="confirmacaoExclusao"
				message="Tem certeza que deseja excluir a escola #{manterEscolaBean.escola.nome}?"
				header="Exclusão de escola" severity="alert">
				<p:button icon="pi pi-times" value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton icon="pi pi-check" value="Sim"
					update=":frmPesquisa:escolasTable :frmPesquisa:messages"
					onclick="PF('confirmacaoExclusao').hide();"
					action="#{manterEscolaBean.excluir}" process="@this" />
			</p:confirmDialog>

		</h:form>
	</ui:define>
</ui:composition>
